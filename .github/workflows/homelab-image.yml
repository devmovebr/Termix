name: Homelab image

# Builds Termix with the customized plugin repos in place of their published
# releases and pushes ghcr.io/<owner>/termix. Runs on every push to main; after
# changing only a plugin, run it by hand (Actions > Homelab image > Run).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: homelab-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: termix

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Plugin-Tunnels
          path: plugins/Plugin-Tunnels

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Plugin-SSH-Terminal
          path: plugins/Plugin-SSH-Terminal

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/termix-plugin-agents
          path: plugins/Plugin-Agents

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/termix" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: termix
          file: termix/docker/Dockerfile
          build-contexts: plugins=plugins
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
